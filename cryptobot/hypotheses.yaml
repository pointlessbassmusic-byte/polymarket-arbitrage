  result: "Run 2026-10-12. The premium is real and almost entirely overnight: VTI gross overnight +21.6 / -0.6 / +12.6 / +13.5%/yr (Sharpe 2.47 / -0.02 / 1.53 / 0.99) vs intraday -16.4 / -1.8 / -2.0 / +0.5% for 2001-07 / 2008-14 / 2015-19 / 2020-26; same shape on SPY and the Nasdaq-100. But it is 4-5 bp a night, so the costs eat it: all nights at 4 bp taker + 0.3 bp half-spread nets -4.0 bp/night on VTI (Sharpe -0.56, beats buy-and-hold in 0 of 4 eras; SPY -5.1 bp, NDX -4.7 bp); at 2 bp maker about 0 bp/night (VTI -0.02, SPY -1.07, NDX -0.72; 2020-26 Sharpe +0.14 / -0.30 / +0.01). The weekday subset Mon->Tue at 2 bp maker is the only run that clears the bar, on VTI alone: +5.1 bp/night, Sharpe 0.53, PSR 0.98, 3 of 4 eras incl. 2020-26; it fails on SPY (0 of 2) and the Nasdaq-100 (1 of 4) and its DSR is 0.54 at the 24 trials per instrument. Kalshi's US500 funding over its first 6 days ran 0.019-0.030%/day, 2-4x the fair basis, which alone exceeds the premium"
