- id: kalshi-btc-hourly-tails
  title: "Kalshi hourly BTC above/below markets: are far strikes overpriced (longshot bias), so that buying the favourite at 85-97 cents half an hour before settlement earns the gap after the quadratic fee?"
  source: "the Bitcoin volatility premium measured 2026-10-13 (btc-vrp-listed-options: implied 5 points over realised at 30 days); the longshot-bias literature on betting markets (Thaler & Ziemba 1988; Snowberg & Wolfers 2010); Kalshi's KXBTCD series, about 190 strikes an hour, 30-35 traded, settled on the CF Benchmarks BTC price at the top of the hour; the Polymarket 15-minute markets were calibrated in their last two minutes (near-resolution-capture), which is a different horizon and venue"
  claim: "At 30 and at 15 minutes before an hourly KXBTCD market settles, contracts whose YES mid is at or under 15 cents resolve YES less often than the mid implies, and those at or above 85 cents more often, so buying the favourite side (NO at 1 minus the YES bid when YES is cheap, YES at the ask when YES is dear) at 85-97 cents earns a positive net return per dollar after Kalshi's taker fee of 0.07 x price x (1 - price) a contract."
  test: "cryptobot.kalshi_binaries collects every settled KXBTCD market with volume (listing) and its minute candlesticks (YES bid and ask closes, last trade, volume) for the last 30 days, paced at one public request a second; cryptobot.binary_tails_study takes the quote at the bar ending exactly 30 and 15 minutes before close, buys the favourite at its ask when the favourite's price is 0.85-0.97 and the spread is at most 5 cents, settles on the market's result, charges the fee, and reports net per dollar, hit rate against the implied probability by price bucket (0.85-0.90, 0.90-0.95, 0.95-0.97), with t-statistics clustered by event hour (every strike in an hour settles on the same print). Variants counted as trials: the mirror (buying the longshot), a resting-bid maker fill (filled only when the last trade later goes through the bid, no fee), and the 0.97-0.99 bucket."
  success: "Written before collecting: at both decision times, favourite net per dollar > 0 with cluster t >= 2.0 and positive in both halves of the sample (by event time); otherwise inconclusive; negative net at both decision times is killed. Not traded before a verdict; if alive, paper first on the desk with the Kalshi key, size 1-5 contracts."
  data: "state/kalshi_binaries/markets.jsonl and candles/<date>.jsonl, public Kalshi API (api.elections.kalshi.com), no key"
  result: "Run 2026-10-13 on the full pull: 17,614 traded markets in 706 hours, 2026-09-13 to 2026-10-13 (Kalshi's history reaches 2026-08-06; 30 days were taken). Registered rule, favourite at 0.85-0.97 at the ask with the fee paid: 30 minutes before the print 2,692 trades in 699 hours, net +0.63% per $ (cluster t 1.0), hit 94.2% against an implied 92.6%, halves -0.10% / +1.26%, DSR 0.05; 15 minutes before, 1,797 trades, net +0.35% (t 0.5), hit 94.0% vs 92.7%, halves +0.74% / +0.01%. By price: 0.90-0.95 is the only bucket positive at both times (+1.54% / +0.50%), 0.85-0.90 flips sign, 0.95-0.97 is flat. The mirror says the longshot bias is real: buying the 3-15 cent side loses 34% (t -3.8) and 41% (t -5.0) per $, resolving 4.9% of the time against 6.0% implied. Resting a bid a cent under the ask, no fee, loses 1.7% and 3.4% (t -1.5, -2.5): fills come when the hour is going the other way. The favourite's edge is 1.5 points of probability, and the fee (0.07 x p x (1-p), about 0.5 cents) plus the ask side of a 1-2 cent spread take most of it"
  verdict: inconclusive
  regime: "September-October 2026: tails overpriced (longshots lose 35-40% per dollar), favourites underpriced by about 1.5 points, net +0.4-0.6% per dollar after fees with t at or below 1.0; the written bar (t >= 2 at both decision times, both halves positive) is not met and the net is not negative, so neither alive nor killed. Not traded. A longer sample is one pull away (python -m cryptobot.kalshi_binaries --days 60) if ever wanted"
  rerun: "python -m cryptobot.kalshi_binaries --state state --days 30 && python -m cryptobot.binary_tails_study --state state"
  preregistered: true
  trials_run: 8

- id: kalshi-perps-hourly-rules
  title: "Many small trades a day on Kalshi's perps: do hourly reversal, momentum or hour-of-day rules clear 18 bp a round trip?"
  source: "operator direction 2026-10-13 ('the point is to make many trades with smaller profits that overcome the fees'); Kalshi's 28 perps have hourly candles since June 2026 (3,140 hours for BTC/ETH, 2,994 for DOGE/SHIB); the desk's measured costs on Kalshi (4 bp taker a side, 4-5 bp from mid for $50-500 orders)"
  claim: "At least one simple hourly rule, applied across every Kalshi perp with volume, earns more than 18 bp net per trade (the round trip of 4 bp taker plus 5 bp slippage a side) with enough trades a day to matter: a reversal rule (fade a 1-hour move beyond k sigma, hold 1 or 4 hours), a momentum rule (follow it), the same on 24-hour moves, or a fixed hour-of-day position."
  test: "cryptobot.perp_hourly_study on state/kalshi_hourly/<ticker>.jsonl for every perp (cryptobot.vrp_collect backfill, 150 days). Rule grid written here before running: direction in (reversal, momentum) x window in (1h, 24h) x k in (1.5, 2.0, 3.0) x hold in (1h, 4h) = 24 rules, plus the best long hour and best short hour of the day = 26 trials; one position per coin at a time; every trade charged 18 bp (8 bp as the maker-fill sensitivity). Each rule's full-sample gross and net per trade with t clustered by entry hour (coins move together), trades per day, and the walk-forward series: each calendar month trades the rule that was best net on all prior months."
  success: "Written before running: alive only if the walk-forward series is net positive with PSR >= 0.95 on its monthly returns, DSR >= 0.95 at 26 trials, and positive in at least 2 of its last 3 months; otherwise inconclusive; if every rule is net negative at 18 bp, killed, and the gross edge is recorded so the cost gap is a number."
  data: "state/kalshi_hourly/<ticker>.jsonl, 28 perps, 2026-06 to date (scratch state_collect)"
  result: "Run 2026-10-13 on 20 perps with at least two weeks of hours, 45,419 hourly bars, 2026-06-03 to 2026-10-13. No rule in the grid clears the round trip. Best gross edges: momentum on a 24-hour move beyond 2 sigma held 4 hours +26 bp gross (8 trades a day pooled, net +8 bp at 18 bp, t 0.9, hit 50%); the same at 1.5 and 3 sigma +17 bp gross (net -1 bp); 1-hour reversal at 1.5 sigma +5 bp gross on 29 trades a day (net -13 bp, t -3.6, hit 56%); the best long hour of the day (11 UTC) +9 bp gross (net -9 bp). Every 1-hour rule, reversal or momentum, is under 6 bp gross; the 24-hour reversal rules lose even gross (-5 to -26 bp). Walk-forward, each month trading the rule best on all prior months: 364 trades, -45 bp net per trade (t -2.7), 0 of 4 months positive, PSR 0.01, DSR 0.00 at 26 trials; the rule chosen each month flipped between 24-hour reversal and 24-hour momentum, which is what noise looks like. At 8 bp a round trip (maker fills, optimistic) the single best grid rule reads +18 bp net (t 2.1) but it is the best of 26 and not the walk-forward pick. The gross edge of an hourly rule on this venue is 0-6 bp against a 16-18 bp round trip"
  verdict: inconclusive
  regime: "June-October 2026 on Kalshi perps; 1-hour moves carry under 6 bp of predictable follow-through or reversal, the fee is three times that; 24-hour momentum is the only gross edge above the cost and it does not survive walk-forward selection. Not killed only because one rule is net positive in sample; nothing here trades"
  rerun: "python -m cryptobot.perp_hourly_study --state state --fetch"
  preregistered: true
  trials_run: 26

