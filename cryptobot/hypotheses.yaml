- id: selection-bias-diagnostics
  title: "Correct every 'alive' verdict for the size of the search that produced it (CSCV/PBO, Deflated Sharpe, CPCV, MinTRL)"
  source: "Bailey & Lopez de Prado (PSR 2012, DSR 2014), Bailey, Borwein, Lopez de Prado & Zhu (PBO 2014), Lopez de Prado (CPCV 2018); surfaced by the 2026-10 research sweep"
  claim: "A rule chosen from thousands of (features x bands x barrier geometry x side) trials needs a far higher backtest Sharpe than a pre-specified one; without the correction, walk-forward years can all be positive and the rule still be the best of noise."
  test: "cryptobot/stats.py: trial matrix of all 4,512 trials actually searched; N_eff from the correlation participation ratio; CSCV with time-contiguous blocks and a 14-day purge; DSR on raw P&L and on the lift over the unconditional basket; CPCV 6x2 with purge and embargo; PSR and MinTRL for the sim book."
  data: "hl_daily.pkl (18 coins), hl_daily_us3.pkl (3 coins), hl_funding.pkl"
  result: "Both bounce-short entries downgraded alive -> inconclusive. The rule family is not a CSCV overfit (PBO 0.09-0.22) and CPCV paths are all positive, but the specific rule was never IS-best, its PSR is 0.87-0.99, DSR is 0.00 at nominal N and at most 0.18-0.35 at N_eff, cross-sectional lift is zero (basket timing, not coin selection), and the sim book would need 32-104 months to confirm SR>0."
  verdict: adopted
  regime: "method; applies to every future entry. Rule: alive requires DSR >= 0.95 at N_eff, PBO <= 0.5 and >= 80% CPCV paths positive; otherwise inconclusive. Record trials_run and n_eff on every entry that reaches a verdict."
  rerun: "python -m cryptobot.stats --cache hl_daily.pkl --funding hl_funding.pkl --rule \"short:move_1d[2]&move_3d[0]\" --target 0.20 --stop 0.10 --days 14 [--sides short] [--flat-cost 0.004]"
