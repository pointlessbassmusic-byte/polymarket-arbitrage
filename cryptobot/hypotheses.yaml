- id: carry-leverage
  title: "Lever the carry perp leg (1.5x-3x) to raise return on capital"
  source: "original research"
  claim: "Less perp margin per position frees capital for a bigger position."
  test: "Replay 187 carry trades on daily perp candles with guards; a day reaching liquidation counts as one."
  data: "150 Kraken-tradeable perps, 2023-2026"
  result: "every leverage above 1x either liquidates (2x: 7-29 trades) or needs a guard so tight it exits too often; best is 1x"
  verdict: killed
  regime: "high-funding coins are the ones that pump: one in ten holds rose 80%+, largest single day +67%"
  rerun: "see README 'Carry on capital'"

- id: carry-margin-guard
  title: "Close both carry legs when the coin rallies 50% above entry"
  source: "original research"
  claim: "A guard removes liquidation risk at little cost, because the hedge makes the rally itself P&L-neutral."
  test: "Same replay, guards +15% to +50%."
  data: "187 carry trades, 2023-2026"
  result: "1x + 50%: zero liquidations (16 without a guard), worst year +3.8% on capital vs +5.1% unguarded-but-uncharged"
  verdict: adopted
  regime: "hourly monitoring; daily data cannot rule out an intra-hour jump straight through both levels"
  rerun: "see README 'Carry on capital'"

