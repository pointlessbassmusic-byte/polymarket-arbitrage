- id: perp-bounce-short
  title: "Short a one-day bounce inside a decline (Hyperliquid perps)"
  source: "original research"
  claim: "move_1d top tercile AND move_3d bottom tercile -> short, -20% target / +10% stop / 14d."
  test: "Yearly walk-forward (cuts refit on prior years); bot replay reconciled trade for trade."
  data: "18 memecoin perps, daily, 2022-2026"
  result: "5/5 years positive, beats unconditional short 5/5, +1.47%/trade over 938; replay +1.24%; on capital with one 1/18 slot per coin: +5.2% / +1.4% / +35.8% / +11.2% for 2023-26, max drawdown -15.5%. SELECTION-BIAS DIAGNOSTICS (cryptobot.stats, 2026-10-08): 4,512 trials searched, N_eff 28.7 (short-only family 10.5); CSCV PBO 0.22 (short-only 0.12) but the rule was IS-best in 0% of splits and is a median column within the short family (OOS rank 0.57); PSR 0.91 (not significant at 5%); DSR 0.00 at nominal N, 0.18-0.35 at N_eff; cross-sectional lift over the same-day basket +0.002% (zero: the edge is WHEN to short the basket, not WHICH coin); CPCV 5/5 paths and 15/15 splits positive net and lift; MinTRL(SR*=0) about 104 months"
  verdict: inconclusive
  regime: "survives the 2024 mania and 2025-26 collapse in walk-forward and CPCV, but after correcting for the ~4,500-rule search its t-stat (1.3) is what the best of a few dozen independent null trials shows; live P&L cannot confirm or refute it for years"
  trials_run: 4512
  n_eff: 28.7
  pbo: 0.22
  dsr: 0.18
  rerun: "python -m cryptobot.perp_study --cache hl_daily.pkl --funding hl_funding.pkl --target 0.20 --stop 0.10 --days 14 --walk-forward \"short:move_1d[2]&move_3d[0]\""

