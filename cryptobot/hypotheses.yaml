- id: pead-per-price-smallcap
  title: "Post-earnings drift in sub-$2B names, surprises scaled by price, judged out of sample"
  source: "the post-hoc variant of pead-revisit (2026-10-12): +1.32%/month over all announcers in-sample, DSR 0.68 at 5 trials, on a survivorship-biased panel with a current-cap size filter"
  claim: "Each month, among announcers with at least 3 estimates and a market cap at or under $2B AT THE TIME, the top decile by (reported EPS - consensus) / last close, bought at the next session's open and held 20 sessions, beats the equal-weight return of all such announcers over the same windows by at least 0.5% a month after 5 bp a side."
  test: "Out of sample only: calendar months from 2026-11 on, collected as they happen (python -m cryptobot.pead_collect calendar --start <month> and prices for the new symbols), so the market cap and the listing status are point-in-time and nothing delisted is lost. Same study code (pead_study --rank-by per_price --max-cap 2e9)."
  success: "Written before running: after 24 out-of-sample months, mean spread >= +0.5%/month with PSR >= 0.95 and at least 16 of 24 months positive; otherwise inconclusive; a mean spread at or below zero is killed. Not traded before then; the in-sample figure is the reason to look, not evidence."
  data: "state/earnings/ from 2026-11 was to be collected monthly; the in-sample panel (scratch, 2015-2026) answered first"
  result: "KILLED before the first out-of-sample month, 2026-10-13, by its own placebo: with the same sort, the same names and the same panel, entering 25 sessions after the usual open (a window with no announcement in it) earns +1.77%/month (Sharpe 1.13, PSR 1.00, 10 of 11 years) against +1.32% at the real entry; 60 sessions late +1.38%. Entering 25 sessions BEFORE the report earns -1.10%/month when the surprise is divided by the last close and +1.86% when divided by the close 25 sessions earlier, so the ranking selects names by their price path into the report, not by the news. A point-in-time size filter (trailing dollar volume <= $10M/day) keeps all of it: real entry +1.57%, late placebo +1.68%, early placebo -0.87%. The claim was announcement drift; the data show a characteristic of cheap, recently-fallen small survivors that is there whenever you look, which in a current-listings-only panel is what survivorship looks like. An out-of-sample test of 'drift' would have measured that characteristic and called it drift"
  verdict: killed
  regime: "2017-2026 panel; the effect is not tied to the announcement in any era (2022-26: real entry +76%, late placebo +111%)"
  rerun: "python -m cryptobot.pead_study --state state --max-cap 2e9 --rank-by per_price --entry-offset 25 (and -25, and --price-lag 25)"
  preregistered: true
  trials_run: 10

