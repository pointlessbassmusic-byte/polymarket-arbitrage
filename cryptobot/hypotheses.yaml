  data: "Hyperliquid daily perps 2022-2026 for DOGE/kPEPE/kSHIB (Coinbase candles only since 2025-12)"
  result: "5/5 years positive, beats unconditional short 5/5, +2.76%/trade over 230; on capital at 0.40%: +9.6/+6.9/+20.1/+50.1/+7.0%; deployed sizing with whole contracts, Coinbase fee floor and overnight short margin: $1,500 +8.9/+9.0/+11.0/+3.4/-2.6, $3,000 +4.5/+9.1/+17.2/-7.8/-2.8, $6,000 +9.8/+8.9/+14.6/+36.6/-0.4; max DD about -20%"
  verdict: inconclusive
  regime: "2022 bear through 2025 collapse; contracts are whole (~$420 DOGE / ~$380 1000PEPE / ~$53 1000SHIB) and overnight short margin is 92-114%, so under ~$6,000 the account skips DOGE/PEPE when they are expensive. Diagnostics (short-only family, flat 0.40%): N_eff 26, PBO 0.21, named rule OOS rank 0.88 and never IS-best, PSR 0.99 but DSR 0.13 daily / 0.34 on 14-day blocks at N_eff (0.00 at nominal N), cross-sectional lift zero, CPCV 5/5 paths positive, MinTRL(SR*=0) 32 months"
  trials_run: 4512
  n_eff: 26.1
  pbo: 0.21
  dsr: 0.34
  rerun: "python -m cryptobot.perp_study --cache hl_daily_us3.pkl --funding hl_funding.pkl --target 0.20 --stop 0.10 --days 14 --walk-forward \"short:move_1d[2]&move_3d[0]\""

