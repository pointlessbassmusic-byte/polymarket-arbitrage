  success: "Written before any backtest: CANDIDATE for a cell if net >= +5 bp a trade at t >= 2.5 with both halves positive over >= 200 trades and DSR >= 0.95 at 24 trials; a candidate on >= 2 assets in the same variant and timeframe goes to the paper bot's real-money gate review after 100 paper trades. KILLED for a variant if net per trade is negative on every asset at both timeframes. Otherwise inconclusive. The paper bot runs regardless (it costs nothing) and its record is read against this backtest."
