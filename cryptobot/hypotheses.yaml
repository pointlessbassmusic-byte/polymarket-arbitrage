- id: binary-conditional-vol-2026-10
  title: "Pairing the range profile with Kalshi's crypto binaries: does a conditional dispersion model price the hourly BTC strike ladder and the 15-minute up/down market better than the market does?"
  source: "operator question 2026-10-13 (how the swing/range profile pairs with Kalshi's 15-minute and hourly crypto markets); addendum 25 (direction is unpredictable, dispersion is: hour of day, recent range, VIX level); kalshi-btc-hourly-tails (longshots overpriced, favourites +0.6%/$ at t 1)"
  claim: "A binary pays on dispersion, not direction. The empirical distribution of BTC's remaining-horizon log return, built from two years of Coinbase 5-minute bars strictly before the binaries sample and conditioned on the decision hour (UTC) and the recent range (the last 60 minutes' high-low over its trailing median, in terciles), gives a probability for every KXBTCD contract (strike ladder, at 30 and 15 minutes before the hourly print) and every KXBTC15M contract (up/down against the slot's opening BRTI, at 10 and 5 minutes before the print) that is better calibrated than Kalshi's mid (lower Brier score), and buying the side whose model probability exceeds its price by more than the quadratic fee (0.07 x p x (1-p)) plus one cent earns a positive net return per dollar."
  test: "cryptobot.binary_vol_study: for each contract and decision time, spot = the Coinbase 5-minute close at that minute, model p = share of the conditioning bucket's historical log returns over the remaining minutes that carry spot past the strike (greater / less by strike_type; for KXBTC15M the strike is the slot's opening BRTI and the remaining-horizon return starts from the current spot); quotes from the market's minute candlesticks (YES bid/ask closes); the trade buys YES at the ask when p - ask > fee + 0.01, NO at 1 - bid when (1 - p) - (1 - bid) > fee + 0.01, settles on the result, pays the fee; net per dollar with t clustered by event (every strike in an hour settles on one print), by half; Brier of model vs mid on every quoted contract; calibration deciles. Variants, each a trial: unconditional, hour only, hour x range tercile; x 2 decision times x 2 series = 12 trials. Basis between Coinbase and BRTI is measured as settle minus the Coinbase close at the print and reported."
  success: "Written before running: CANDIDATE if, for the hour x range variant on a series, the model's Brier beats the mid's and the net is >= +1% per dollar at a cluster t >= 2.5 with both halves positive; then it goes to a paper rule on that series for 200 contracts before any real money. KILLED for a series if the model's Brier is worse than the mid's at both decision times (the market already knows the profile). Otherwise inconclusive."
  data: "scratch btc5m/btc_5m.json (model, bars before 2026-09-13 only), state_collect/kalshi_binaries (KXBTCD, 17,614 markets, 2026-09-13 to 2026-10-13), state_binaries_15m (KXBTC15M, ten days)"
  result: "Run 2026-10-13. Basis between Coinbase and the BRTI settlement: +0.2 bp mean, 2.4 bp sd (hourly), 2.0 bp (15-minute), so the spot is not the problem. KXBTCD, 17,614 markets, 7,696 two-sided quotes at 30 minutes and 4,896 at 15: the market's mid has the lower Brier at both times (0.0855 vs the model's 0.0876-0.0908 at 30 min; 0.0849 vs 0.0861-0.0908 at 15), on every variant. Trades the model likes lose 20-24% per dollar (cluster t -2.7 to -3.3, avg price 0.27-0.33: it buys longshots the market has already discounted). The model is calibrated in shape but too wide: the sample month ran 25% calmer than the two-year history (30-minute sd 26 bp vs 34; monthly 30-minute sd ranges 20-52 bp). The post-hoc vol-scaled variant (trailing 7-day realised over history) closes most of the gap (Brier 0.0872 / 0.0861, trades -8.7% t -2.6 and -3.6% t -0.5) and still loses to the mid. KXBTC15M, 952 markets over ten days, every slot quoted: mid Brier 0.1841 at 10 minutes vs model 0.1858-0.1896, 0.1331 at 5 minutes vs 0.1367-0.1421; trades -12% to -1% per dollar at 10 minutes, -8% to +7% at 5 minutes with t within 0.8 (the +5.1%/$ vol-scaled variant at 5 minutes is 666 trades over ten days at t 0.6). KILLED on both series by the registered rule: Kalshi's mid is a better dispersion forecast than the profile, conditioned or vol-scaled. The 15-minute market prices the remaining-horizon distribution within 0.2 Brier points of the best model we can build from two years of 5-minute bars"
  verdict: killed
  regime: "2026-09/10: the hourly ladder and the 15-minute up/down market already embed hour-of-day, recent range and current vol; a historical-distribution model loses to the mid on calibration and on trades. The profile does not pair with the binaries as a pricing edge"
  rerun: "python -m cryptobot.binary_vol_study --scratch <dir>"
  preregistered: true
  trials_run: 16

