  success: "Written before running: MAKER candidate on a ticker if net markout (after 2 bp) at 300 s is >= +1 bp with cluster t >= 2.5 and both halves positive; then a paper quoting bot on that ticker (inventory capped, both sides at the touch) for 14 days measured against the tape. MAKER killed on a ticker if net markout is negative at both horizons. FLOW candidate if the sign rule nets >= +4 bp a trade at t >= 2.5 with both halves positive at the maker cost; killed if the coefficient has the wrong sign in both halves. BINARIES MAKER candidate on a horizon class if filled orders net >= +1% per dollar at cluster t >= 2.5 over >= 30 events with both halves positive; killed if negative. Otherwise inconclusive."
