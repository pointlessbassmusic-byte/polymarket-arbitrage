- id: pead-revisit
  title: "Post-earnings-announcement drift, long top-decile surprises 20 days, in small and mid caps"
  source: "Martineau 2022 (drift gone in large caps); 2025 revival papers on PEAD in small caps and with analyst-revision conditioning; operator question 2026-10-09"
  claim: "Buying the top decile of standardised earnings surprises at the next open and holding 20 trading days (shorting the bottom decile where borrow is cheap) earns a net positive spread in stocks below the Russell 1000 cut-off, after 5 bp a side and the realised half-spread."
  test: "Earnings surprise history from a free feed (Alpha Vantage EARNINGS or equivalent) 2015-2026, daily prices from Stooq or Alpaca; decile portfolios rebalanced on announcement, long-only and long-short; walk-forward by year; PSR on the monthly spread."
  success: "Written before running: long-only top-decile net Sharpe above the equal-weight small-cap benchmark by >= 0.3 with PSR >= 0.95 over 2015-2026 and net positive in 2022-2026; otherwise inconclusive. Queued behind overnight-index-perp, pairs-doge-shib-us and orb-qqq-pilot; do not start before those are resolved."
  data: "Nasdaq data API, no key: the daily earnings calendar for every weekday 2015-2026 (symbol, reported EPS, consensus, % surprise, number of estimates, market cap) and ten years of daily OHLC per symbol, collected by cryptobot.pead_collect into state/earnings/. Limits: past calendars do not say before/after the open, so entries are at the NEXT session's open (day one is given up for pre-market reporters); the market cap is the current one, a slow size filter"
  result: "Run 2026-10-12 on 167,004 calendar rows (3,072 trading days 2015-2026; Nasdaq's calendar has gaps, 18 days in June 2016) and 1,977 price histories; usable windows for 85% of the 33,384 qualifying announcements under $5B, effectively 2017-2026 (ten-year histories; 2016 at 23%). The pre-registered sort (percentage surprise): top decile MINUS all announcers -0.65%/month at <= $5B (Sharpe -0.53, PSR 0.06, 2022-26 -36.9%, 4 of 11 years positive), -0.82%/month at <= $2B (Sharpe -0.59), -0.25% with no cap (39% coverage, so not a real no-cap test); long-short Sharpe -0.27 / -0.32. Ranking by (EPS - consensus) / price instead, the academic scaling and a post-hoc variant: +0.65%/month at <= $5B (Sharpe +0.42, PSR 0.89) and +1.32%/month at <= $2B (Sharpe +0.83, PSR 0.99, 10 of 11 years, 2022-26 +76%), with the long-short Sharpe still negative (-0.43: the bottom-decile short loses, which is what survivorship does to it). Across the 5 full-panel runs looked at the best variant's DSR is 0.68 (MinTRL 45 months). The written bar (Sharpe >= 0.3 with PSR >= 0.95) is cleared only by the variant that was not pre-registered, on a panel with two known biases: current listings only (delisted names missing) and today's market cap as the size filter (look-ahead on who is small). Robustness 2026-10-13 on the same panel, price-scaled sort: (a) size by trailing 60-session median dollar volume instead of today's cap (point-in-time): <= $10M/day +1.57%/month (Sharpe 0.84, PSR 0.99, 88 months), <= $3M/day +2.34% (Sharpe 0.75), so the size look-ahead is not what made it; (b) placebo entries, cap <= $2B: 25 sessions AFTER the usual open (sessions 25-45, before the next report) +1.77%/month, Sharpe 1.13, PSR 1.00, 10 of 11 years, MORE than the real entry's +1.32%; 60 sessions after +1.38% (Sharpe 1.10); 25 sessions BEFORE the report (sessions -25 to -5) -1.10%/month (Sharpe -0.83); the same three with the dollar-volume filter +1.68% / n.a. / -0.87%; (c) denominator moved to the close 25 sessions before the report: real entry +1.26%, late placebo +1.62%, early placebo flips to +1.86% (Sharpe 1.41). So the top decile beats the other announcers in any window, the announcement adds nothing (the late placebo wins by more), and the sign of the pre-report window is set by the denominator's date: dividing by the last close selects names that fell into the report. What is left is a characteristic of cheap, recently-fallen small survivors in a survivors-only panel, not drift"
  verdict: inconclusive
  regime: "percentage surprises are noise (tiny-denominator names dominate the deciles); the price-scaled sort's spread is present before, at and a month after the announcement, so it is not announcement drift and is most simply survivorship plus a low-price selection. Follow-up pead-per-price-smallcap killed 2026-10-13; the monthly panel collection is off"
  rerun: "python -m cryptobot.pead_collect calendar --state state --start 2015-01-01 && python -m cryptobot.pead_collect prices --state state --max-cap 5e9 --workers 3 && python -m cryptobot.pead_study --state state --max-cap 5e9 (variants: --rank-by per_price --max-cap 2e9; placebos --entry-offset 25 / -25; --max-dollar-volume 1e7; --price-lag 25)"
  preregistered: true
  trials_run: 17

- id: cross-asset-crypto-leadlag
