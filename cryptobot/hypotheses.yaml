  data: "scratch xasset/ (FRED CSVs, btc_hourly_2015_2019.pkl, cb_daily_btc_eth.pkl, kalshi_hourly.pkl), btc_hourly.pkl, hl_daily.pkl, hl_all_daily.pkl"
  result: "Run 2026-10-09 on 2,818 US business days 2015-07 to 2026-10. Contemporaneous: BTC-S&P correlation 0.02 (2015-19), 0.36 (2020-21), 0.49 (2022-23), 0.42 (2024-26); Nasdaq the same; VIX change -0.37 to -0.42; broad dollar -0.15 to -0.23; 10y and 2y yield changes within +-0.13; Nikkei +0.06; by half-year the S&P correlation has not been below 0.16 since 2020H1 (peak 0.60-0.64 in 2022H1). Lead-lag: none of the 52 (predictor, target) regressions clears the bar; strongest is 10y real yield -> BTC next 5 days (NW t -2.57 full, -2.02 in 2022-23, -0.60 in 2024-26, so it fails the latest-era test); S&P -> BTC next 24h is mildly negative (t -1.42 / -1.75 in the last two eras), i.e. no lagged follow-through; memecoin and all-perp baskets: nothing above |t| 1.8. Multivariate R2 0.003-0.03. Divergence: stocks up / BTC down is followed by +0.41% next 24h (t 1.5, n 194; +0.82% t 2.3 in 2024-26 but -0.57% in 2022-23); stocks down / BTC up +0.52% (t 1.5, n 141). Reverse: BTC's 16:00-09:00 ET move 'predicts' the next S&P close-to-close with t 3.9 (7.9 in 2024-26, corr 0.21), which is the overnight futures gap the cash close already contains, not a lead; the Kalshi US500 perp has 76 hours of history so the intraday version cannot be run yet. Walk-forward BTC rules at 8 bp: follow-the-S&P sign rule Sharpe -0.42 (net negative 2024-26: killed as a sub-rule); OLS stocks-only +0.25 (PSR 0.77); rates+VIX +0.06; all predictors +0.03 (-0.31 at 20 bp). Best rule DSR 0.14 at 69 trials"
