  source: "operator request 2026-10-09 ('cross asset correlation: us stocks, foreign stocks, bonds, rates vs price up bitcoin down; run regressions across asset classes to look for patterns and build new strategies'); the 2022-2024 BTC-Nasdaq correlation literature (IMF 2022 'Crypto and equity markets are increasingly correlated'; Fed FEDS notes on crypto-equity comovement)"
