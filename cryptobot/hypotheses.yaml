  data: "18 memecoin perps, daily, 2022-2026"
  result: "looked 6/6 with first-half cuts (leak); honest walk-forward loses 2024 (-2.27%)"
  verdict: killed
  regime: "fails in manias"
  rerun: "python -m cryptobot.perp_study --cache hl_daily.pkl --funding hl_funding.pkl --target 0.20 --stop 0.10 --days 14 --walk-forward \"short:move_7d[2]&rvol_7d[1]\""

