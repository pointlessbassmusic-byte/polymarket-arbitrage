- id: family-search-2026-10
  title: "Systematic rule search over every dataset the desk holds, with the selection-bias machinery applied to the whole family, not the winner"
  source: "operator direction 2026-10-13 ('experiment with all possibilities within the data to build new working models'); the method that produced and then deflated the bounce-short (cryptobot.stats: trial matrix, N_eff, CSCV PBO, DSR, CPCV)"
