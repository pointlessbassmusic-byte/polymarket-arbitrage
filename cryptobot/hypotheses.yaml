# Every strategy idea this project has tested, including the ones that
# failed. Negative results are kept on purpose: a hypothesis killed in one
# regime should not be re-tested from scratch, and one that is re-tested
# should be checked against the conditions it died in.
#
# verdict: alive | adopted | killed | inconclusive
# Optional on any entry that reached a verdict from a search: trials_run
# (how many rules/geometries were tried), n_eff (effective independent
# trials), pbo, dsr — see the selection-bias-diagnostics entry. "alive"
# needs DSR >= 0.95 at n_eff, PBO <= 0.5 and >= 80% CPCV paths positive.
# Run `python -m cryptobot.hypotheses --similar "idea text"` before testing
# something new.

- id: dex-breakout
  title: "DEX 5-minute volatility breakout, long"
  source: "original design"
  claim: "Buy memecoins breaking out on volume over 5m/30m windows."
  test: "Walk-forward, 6 windows, realistic DEX round trip."
  data: "18 DEX memecoin pools, 21 days, 2026-09"
  result: "2 trades, gross -$3.04 on $200, net -$4.05"
  verdict: killed
  regime: "memecoin bear, Sep 2026"
  rerun: "python -m cryptobot.study --cache pools.pkl --windows 6"

